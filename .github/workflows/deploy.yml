# Deploys the API to the beta: applies new migrations to the hosted Supabase database, builds the
# server's image (api/Dockerfile) and rolls it out on Cloud Run. Run it by hand from `main`
# (Actions → deploy → Run workflow). scripts/gcp-setup.sh made the Google Cloud side once.
# GitHub holds no keys: the job signs in to Google through Workload Identity, and the server's
# secrets live in Secret Manager, which Cloud Run reads as the server starts.
# https://github.com/google-github-actions/auth#workload-identity-federation-through-a-service-account
# https://cloud.google.com/run/docs/configuring/services/secrets
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  # For the token Workload Identity trades for a short-lived Google one.
  id-token: write

concurrency:
  # One deploy at a time, and never cancel one halfway through its migrations.
  group: deploy
  cancel-in-progress: false

# None of these is secret.
env:
  GCP_PROJECT_ID: TODO
  GCP_PROJECT_NUMBER: TODO
  GCP_REGION: us-east4
  SUPABASE_URL: TODO
  SERVICE: wildcard-api

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: beta
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/wildcard
          service_account: github-deploy@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3

      # `database-url` is the transaction pooler (port 6543), which the server shares across
      # instances. Migrations run through the session pooler on 5432 of the same host, which keeps
      # one connection for the whole run as the CLI needs, with TLS checked as the server checks it.
      # https://supabase.com/docs/guides/database/connecting-to-postgres
      #
      # A migration the hosted database already ran is never run again, so an edit to one would
      # silently never reach it. Until there are real users, migrations are edited in place
      # (AGENTS.md), so that needs a person to reset the beta database first. The database itself
      # keeps the hash of each migration file it ran, as a comment on the CLI's history table,
      # written after every push, even one that fails partway.
      - name: Apply new migrations
        run: |
          # A failed psql inside a pipe or a test must stop the step, never pass the guard.
          set -o pipefail
          database_url="$(gcloud secrets versions access latest --secret database-url)"
          echo "::add-mask::$database_url"
          case "$database_url" in
            *\?*) echo "::error::database-url should have no query string" && exit 1 ;;
            *:6543/*) ;;
            *) echo "::error::database-url should be Supabase's transaction pooler (port 6543)" && exit 1 ;;
          esac
          userinfo="${database_url#*://}"
          userinfo="${userinfo%@*}"
          password="${userinfo#*:}"
          echo "::add-mask::$password"
          echo "::add-mask::$(printf '%b' "${password//%/\\x}")"
          # A raw @, / or : splits the URL somewhere else, and psql would print the rest of it.
          if [[ ! "$password" =~ ^[A-Za-z0-9%._~-]+$ ]]; then
            echo "::error::Percent-encode the database-url password, or reset it to letters and digits"
            exit 1
          fi
          ca="$PWD/api/apps/server/certs/supabase-root-2021.crt"
          url="${database_url/:6543\//:5432/}?sslmode=verify-full&sslrootcert=$ca"
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          history="supabase_migrations.schema_migrations"
          # "<version> <sha256 of its file>" for each migration the database ran, from the files here.
          hashes() {
            psql "$url" -Atc "select version from $history order by version" | while read -r version; do
              for file in supabase/migrations/"$version"_*.sql; do
                if [ -f "$file" ]; then echo "$version $(sha256sum < "$file" | cut -d' ' -f1)"; fi
              done
            done
          }
          exists="$(psql "$url" -Atc "select to_regclass('$history') is not null")"
          if [ "$exists" = t ]; then
            recorded="$(psql "$url" -Atc "select obj_description('$history'::regclass, 'pg_class')")"
            ran="$(psql "$url" -Atc "select count(*) from $history")"
            current="$(hashes)"
            if [ "$ran" -gt 0 ] && [ "$current" != "$recorded" ]; then
              echo "::error::Migrations the hosted database already ran were edited, removed or run outside this workflow. Reset the beta database first."
              diff <(echo "$recorded") <(echo "$current") || true
              exit 1
            fi
          fi
          record() {
            status=$?
            psql "$url" -v ON_ERROR_STOP=1 -v hashes="$(hashes)" <<<"comment on table $history is :'hashes'" ||
              status=1
            exit "$status"
          }
          trap record EXIT
          npx --yes supabase@2.121.0 db push --yes --db-url "$url"

      - name: Build and push the image
        run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/wildcard/api:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -t "$image" api
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          # --update-* keeps what was set by hand in the console (APNS_*, APPLE_*, LLM_PROVIDER...).
          secrets="DATABASE_URL=database-url:latest,SUPABASE_SECRET_KEY=supabase-secret-key:latest"
          # Optional keys: the server runs without them, with that feature off (JOBS_TOKEN: the
          # scheduled jobs, such as the daily progress push).
          for key in openai-api-key anthropic-api-key jobs-token; do
            if gcloud secrets describe "$key" >/dev/null 2>&1; then
              variable="$(tr 'a-z-' 'A-Z_' <<<"$key")"
              secrets="$secrets,$variable=$key:latest"
            fi
          done
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$GCP_REGION" \
            --service-account "wildcard-api@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --max-instances 3 \
            --update-secrets "$secrets" \
            --update-env-vars "SUPABASE_URL=$SUPABASE_URL,PUBLIC_URL=https://$SERVICE-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app,DATABASE_CA_FILE=/api/apps/server/certs/supabase-root-2021.crt"

      - name: Check it answers
        run: |
          url="https://$SERVICE-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app"
          curl -fsS --retry 5 --retry-all-errors "$url/health"
