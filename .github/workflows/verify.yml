# Runs scripts/verify.sh for ready PRs and pushes to main (AGENTS.md, CI).
# GitHub-hosted runners are free while the repo is public. macos-26 ships Xcode 26, which the
# App Store requires since 2026-04-28 and Liquid Glass needs. Never use a self-hosted
# runner here: on a public repo a fork's PR could run code on that machine.
# macOS runners have no Docker, so the database and API checks run in a Linux job.
# The `ios` job runs the app's UI tests on a simulator and uploads their screenshots.
# Free macOS runners are few and shared by every PR, and one iOS run takes about 30 minutes, so
# no merge uses a Mac on its own. `ios` runs on a schedule, every 3 hours,
# for what main changed since the last scheduled run (nothing when main didn't change), on a
# manual run (Actions -> verify -> Run workflow) and on a PR carrying the `ios-ci` label; the
# macOS `verify` only on the last two, and `avatar-preview` (GIFs for reviewers, no checks of
# its own) on manual runs only. Owners check screens on the next scheduled run and fix
# forward. Pushes to main and every other PR run the Linux checks only (`verify` on Linux builds
# and tests the Swift packages).
# Every job runs only when the files a change touches can break what it checks: `verify` for the
# app's Swift (and the OpenAPI file its generated types come from), `supabase` for the database,
# the API and the app's Backend adapters, `web` for the site; `ios` and `avatar-preview` only
# when the change touches what they build. A skipped job counts as passing for branch protection.
# Pushes to main diff against the commit before the push (the PR already ran the full merge);
# a scheduled run diffs against the commit the last scheduled run checked.
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  # The macOS jobs for main (UTC). GitHub may start a scheduled run some minutes late.
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The `changes` job reads which commit the last scheduled run checked.
  actions: read

concurrency:
  # A PR's newer push cancels its older run. A run for main has a group of its own (its commit),
  # so it is never cancelled and never replaces a waiting one: GitHub keeps only one pending run
  # per group, which dropped every main run but the newest while the few Macs were busy.
  # Adding a label other than `ios-ci` gets its own group, so it never cancels the PR's real run.
  # A scheduled run has its own group too, so it never replaces the push run for the same commit.
  group: >-
    verify-${{ github.event.pull_request.number || github.sha }}${{
    github.event.action == 'labeled' && github.event.label.name != 'ios-ci' && '-label' || '' }}${{
    github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which macOS jobs this PR needs, from the files it changes against its base.
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ios-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.diff.outputs.mac }}
      swift: ${{ steps.diff.outputs.swift }}
      backend: ${{ steps.diff.outputs.backend }}
      web: ${{ steps.diff.outputs.web }}
      app: ${{ steps.diff.outputs.app }}
      ios: ${{ steps.diff.outputs.ios }}
      avatar: ${{ steps.diff.outputs.avatar }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MAC: >-
            ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
            contains(github.event.pull_request.labels.*.name, 'ios-ci') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A scheduled run checks what main changed since the commit the last scheduled run
          # checked (a cancelled one doesn't count), and nothing when that is this commit.
          if [ "$EVENT" = schedule ]; then
            BASE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --event schedule \
              --branch main --status completed --limit 20 --json headSha,conclusion \
              --jq '[.[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].headSha // ""')"
            echo "last scheduled run checked ${BASE:-nothing yet}"
            if [ "$BASE" = "$HEAD" ]; then
              echo "main hasn't changed since; nothing to run"
              MAC=false
            fi
          fi
          # A push with no usable "before" (a new branch, a force push) checks everything.
          if ! files="$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD" 2>/dev/null)"; then
            files="$(git ls-files)"
          fi
          printf '%s\n' "$files"
          # The Mac is for scheduled and manual runs and PRs that ask for it with the `ios-ci` label.
          echo "mac=${MAC}" >> "$GITHUB_OUTPUT"
          touches() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          # swift: the app's Swift checks, and the OpenAPI file its generated types must match.
          echo "swift=$(touches '^(ios/|api/apps/server/openapi\.json$|scripts/(verify|install-swiftlint|swift-openapi)\.sh$|scripts/swiftlint-version$|\.swift-format$|\.swiftlint\.yml$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          # backend: the database, the API, and the app's adapters that run against them.
          echo "backend=$(touches '^(supabase/|api/|ios/|scripts/|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          # web: the website, and the app art and font its generated files come from.
          echo "web=$(touches '^(web/|ios/Packages/Avatar/Sources/AvatarArt/|ios/Packages/DesignSystem/Sources/DesignSystemUI/Resources/Fonts/|scripts/verify\.sh$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          # app: anything the macOS `verify` runs, so a change to it is tested on a Mac before main.
          echo "app=$(touches '^(ios/|scripts/(verify|install-swiftlint|swift-openapi)\.sh$|scripts/swiftlint-version$|\.swift-format$|\.swiftlint\.yml$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "ios=$(touches '^(ios/|scripts/ios-test\.sh$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "avatar=$(touches '^(ios/Packages/(Avatar|DesignSystem)/|scripts/avatar-preview\.sh$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    # If `changes` failed, run rather than skip; a draft PR skips `changes`, and so this.
    # A scheduled run is for `ios` and `avatar-preview`: the push to main already ran this.
    if: >-
      !cancelled() && !github.event.pull_request.draft && needs.changes.result != 'skipped' &&
      github.event_name != 'schedule' &&
      (needs.changes.result != 'success' || needs.changes.outputs.swift == 'true')
    # macOS also compiles the SwiftUI code (which Linux compiles out) and runs SwiftLint's custom
    # rules (which need SourceKit); a PR that changes neither the app nor its build and lint
    # setup can't break those. If `changes` failed, stay on Linux; main's run covers the Mac.
    runs-on: >-
      ${{ (needs.changes.outputs.mac == 'true' && needs.changes.outputs.app == 'true')
      && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The Linux image ships Swift (with swift format), as the supabase job relies on.
      - run: swift --version
      # Ahead of the image's own SwiftLint on PATH, which may be a different version.
      - name: Install the pinned SwiftLint
        run: |
          scripts/install-swiftlint.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/verify.sh swift

  # The website's checks (generated files current, ESLint, Prettier, the Playwright layout tests),
  # on Linux, for a change to web/ or to what it is generated from.
  web:
    needs: changes
    if: >-
      !cancelled() && !github.event.pull_request.draft && github.event_name != 'schedule' &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global pnpm@10.28.0
      - run: scripts/verify.sh web

  supabase:
    needs: changes
    if: >-
      !cancelled() && !github.event.pull_request.draft && github.event_name != 'schedule' &&
      (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global pnpm@10.28.0
      # Only the services the database and API tests use.
      - run: npx --yes supabase@2.121.0 start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,postgres-meta,realtime
      # The runner image ships Swift, for the app's Backend adapters.
      - run: swift --version
      - run: scripts/verify.sh supabase api backend
      # The verify-wildcard API journeys, over HTTP against the built server.
      - run: scripts/api-journeys.sh
      # The image the deploy workflow ships builds, starts and reaches the database.
      - name: Start the server's image
        run: |
          docker build -t wildcard-api api
          eval "$(npx --yes supabase@2.121.0 status -o env)"
          docker run -d --name api --network host -e PORT=18080 -e DATABASE_URL="$DB_URL" \
            -e SUPABASE_URL="$API_URL" -e SUPABASE_SECRET_KEY="$SECRET_KEY" wildcard-api
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/health ||
            { docker logs api; exit 1; }

  # Builds the app, runs the UI tests on a simulator and uploads the screenshots they keep,
  # so reviewers and verifiers see every visible change without a Mac.
  ios:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.mac == 'true' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: scripts/ios-test.sh
        env:
          PRINT_PREVIEWS: "1"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named after the commit the PR is at, not the merge commit GitHub tests.
          name: ios-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/ios/screenshots
          if-no-files-found: error
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/ios/Wildcard.xcresult

  # Renders the character's clips on an iOS simulator through the player's own view and
  # uploads them, so reviewers see motion changes without a Mac.
  avatar-preview:
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && needs.changes.outputs.avatar == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: scripts/avatar-preview.sh
        env:
          PRINT_PREVIEWS: "1"
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named after the commit the PR is at, not the merge commit GitHub tests.
          name: avatar-previews-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/avatar/previews
          if-no-files-found: error
