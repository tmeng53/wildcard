# Runs scripts/verify.sh for ready PRs and pushes to main (AGENTS.md, CI).
# GitHub-hosted runners are free while the repo is public. macos-26 ships Xcode 26, which the
# App Store requires since 2026-04-28 and Liquid Glass needs. Never use a self-hosted
# runner here: on a public repo a fork's PR could run code on that machine.
# macOS runners have no Docker, so the database and API checks run in a Linux job.
# The `ios` job runs the app's UI tests on a simulator and uploads their screenshots.
# Free macOS runners are few and shared by every PR, and one iOS run takes three of them for about
# 40 minutes, so no PR runs the UI tests (Tracy, 2026-11-08): PRs merge on the Linux checks plus
# `ios-build`, one Mac compiling the app for about ten minutes (Tracy, 2026-11-14), and `ios`
# runs on main only, on a schedule every 3 hours for what main changed since the last scheduled
# run (nothing when main didn't change) and on a manual run (Actions -> verify -> Run workflow),
# which the merge queue starts before each TestFlight and whose breaks are fixed forward. The
# macOS `verify` and `avatar-preview` (GIFs for reviewers, no checks of its own) run on manual
# runs only: a scheduled run checks what main's pushes already ran on Linux. Pushes to main run
# the Linux checks only, and every PR those plus `ios-build` (`verify` on Linux builds and tests
# the Swift packages).
# Every job runs only when the files a change touches can break what it checks: `verify` for the
# app's Swift (and the OpenAPI file its generated types come from), `supabase` for the database,
# the API and the app's Backend adapters, `web` for the site, `ios-build` for the app; `ios` and
# `avatar-preview` only when the change touches what they build. A skipped job counts as passing for branch protection.
# Pushes to main diff against the commit before the push (the PR already ran the full merge);
# a scheduled run diffs against the commit the last scheduled run checked.
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The macOS jobs for main (UTC). GitHub may start a scheduled run some minutes late.
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      only_testing:
        description: >-
          Run only these UI tests on the simulator (xcodebuild -only-testing ids, space separated,
          e.g. WildcardUITests/PushLongPressUITests) and no other job, to reproduce one bug fast.
        required: false
        default: ""

permissions:
  contents: read
  # The `changes` job reads which commit the last scheduled run checked.
  actions: read

concurrency:
  # A PR's newer push cancels its older run. A run for main has a group of its own (its commit),
  # so it is never cancelled and never replaces a waiting one: GitHub keeps only one pending run
  # per group, which dropped every main run but the newest while the few Macs were busy.
  # A scheduled run has its own group too, so it never replaces the push run for the same commit.
  group: >-
    verify-${{ github.event.pull_request.number || github.sha }}${{
    github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which macOS jobs this PR needs, from the files it changes against its base.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.diff.outputs.mac }}
      swift: ${{ steps.diff.outputs.swift }}
      backend: ${{ steps.diff.outputs.backend }}
      web: ${{ steps.diff.outputs.web }}
      app: ${{ steps.diff.outputs.app }}
      ios: ${{ steps.diff.outputs.ios }}
      avatar: ${{ steps.diff.outputs.avatar }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MAC: >-
            ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A scheduled run checks what main changed since the commit the last scheduled run
          # checked (a cancelled one doesn't count), and nothing when that is this commit.
          if [ "$EVENT" = schedule ]; then
            BASE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --event schedule \
              --branch main --status completed --limit 20 --json headSha,conclusion \
              --jq '[.[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].headSha // ""')"
            echo "last scheduled run checked ${BASE:-nothing yet}"
            if [ "$BASE" = "$HEAD" ]; then
              echo "main hasn't changed since; nothing to run"
              MAC=false
            fi
          fi
          # A push with no usable "before" (a new branch, a force push) checks everything.
          if ! files="$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD" 2>/dev/null)"; then
            files="$(git ls-files)"
          fi
          printf '%s\n' "$files"
          # The Mac is for scheduled and manual runs on main only.
          echo "mac=${MAC}" >> "$GITHUB_OUTPUT"
          touches() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          # swift: the app's Swift checks, and the OpenAPI file its generated types must match.
          echo "swift=$(touches '^(ios/|api/apps/server/openapi\.json$|scripts/(verify|install-swiftlint|swift-openapi)\.sh$|scripts/swiftlint-version$|\.swift-format$|\.swiftlint\.yml$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          # backend: the database, the API, and the app's adapters that run against them.
          echo "backend=$(touches '^(supabase/|api/|ios/|scripts/|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          # web: the website, the app art and font its generated files come from, and the arm bends both players share.
          echo "web=$(touches '^(web/|ios/Packages/Avatar/Sources/AvatarArt/|ios/Packages/Avatar/Tests/arm-bend-cases\.json$|ios/Packages/DesignSystem/Sources/DesignSystemUI/Resources/Fonts/|scripts/verify\.sh$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          # app: anything the macOS `verify` runs, so a change to it is tested on a Mac before main.
          echo "app=$(touches '^(ios/|scripts/(verify|install-swiftlint|swift-openapi|ios-build)\.sh$|scripts/swiftlint-version$|\.swift-format$|\.swiftlint\.yml$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "ios=$(touches '^(ios/|scripts/ios-test\.sh$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "avatar=$(touches '^(ios/Packages/(Avatar|DesignSystem)/|scripts/avatar-preview\.sh$|\.github/workflows/verify\.yml$)')" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    # If `changes` failed, run rather than skip; a draft PR skips `changes`, and so this.
    # A scheduled run is for `ios` and `avatar-preview`: the push to main already ran this.
    if: >-
      !inputs.only_testing && (
      !cancelled() && !github.event.pull_request.draft && needs.changes.result != 'skipped' &&
      github.event_name != 'schedule' &&
      (needs.changes.result != 'success' || needs.changes.outputs.swift == 'true'))
    # macOS also compiles the SwiftUI code (which Linux compiles out) and runs SwiftLint's custom
    # rules (which need SourceKit); a PR that changes neither the app nor its build and lint
    # setup can't break those. If `changes` failed, stay on Linux; main's run covers the Mac.
    runs-on: >-
      ${{ (needs.changes.outputs.mac == 'true' && needs.changes.outputs.app == 'true')
      && 'macos-26' || 'ubuntu-24.04' }}
    # `swift test` for every package, built optimized, takes about 10 minutes on Linux; the limit
    # leaves room for a cold build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The Linux image ships Swift (with swift format), as the supabase job relies on.
      - run: swift --version
      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      # The pinned SwiftLint, downloaded once per version (scripts/swiftlint-version).
      - name: Cache SwiftLint
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/swiftlint
          key: swiftlint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/swiftlint-version') }}
      # Ahead of the image's own SwiftLint on PATH, which may be a different version.
      - name: Install the pinned SwiftLint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/install-swiftlint.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/verify.sh swift

  # A ready PR that changes the app compiles it on one Mac, without running anything: the app
  # target, its extensions, the UI tests and the packages' SwiftUI code compile only on macOS, and
  # SwiftLint's custom rules need SourceKit, so the Linux `verify` can't catch these. Before this
  # job, such a break first showed on main's `ios` run (four times on 2026-11-14) and held
  # TestFlight. About ten minutes of one Mac, and only for a PR that changes what it checks.
  # If `changes` failed, it runs rather than skips, like `verify`. It builds Debug, as the UI
  # tests do; Release-only code first compiles in TestFlight's archive.
  ios-build:
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      needs.changes.result != 'skipped' &&
      (needs.changes.result != 'success' || needs.changes.outputs.app == 'true')
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: xcodebuild -version
      # main's `ios` runs save the cloned packages; a PR only reads them, so it doesn't fill the
      # cache with copies.
      - name: Restore Swift packages
        uses: actions/cache/restore@v4
        with:
          path: build/spm
          key: spm-xcode-${{ hashFiles('ios/**/Package.swift', 'ios/**/Package.resolved') }}
          restore-keys: spm-xcode-
      - name: Install the pinned SwiftLint
        run: |
          scripts/install-swiftlint.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # With SourceKit, so the custom rules run too.
      - run: swiftlint lint --strict --quiet
      - run: scripts/ios-build.sh

  # The website's checks (generated files current, ESLint, Prettier, the Playwright layout tests),
  # on Linux, for a change to web/ or to what it is generated from.
  web:
    needs: changes
    if: >-
      !inputs.only_testing && (
      !cancelled() && !github.event.pull_request.draft && github.event_name != 'schedule' &&
      needs.changes.result != 'skipped' &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global pnpm@10.28.0
      - run: scripts/verify.sh web

  supabase:
    needs: changes
    if: >-
      !inputs.only_testing && (
      !cancelled() && !github.event.pull_request.draft && github.event_name != 'schedule' &&
      needs.changes.result != 'skipped' &&
      (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global pnpm@10.28.0
      # The Supabase CLI npx installs (its install fetches the binary from GitHub releases).
      - name: Cache the Supabase CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-supabase-${{ runner.os }}-2.121.0
      # The Supabase images `supabase start` pulls, saved with `docker save` so a run doesn't pull
      # them from the registries (rate limits, timeouts). Keyed on the CLI version, which pins the
      # images, and config.toml, which picks the Postgres version.
      - name: Restore the Supabase images
        id: supabase-images
        uses: actions/cache/restore@v4
        with:
          path: ~/supabase-images.tar
          key: supabase-images-2.121.0-${{ hashFiles('supabase/config.toml') }}
      - name: Load the Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load -i ~/supabase-images.tar && rm ~/supabase-images.tar
      - run: docker images --format '{{.Repository}}:{{.Tag}}' | sort > "$RUNNER_TEMP/images-before"
      # Only the services the database and API tests use.
      - run: npx --yes supabase@2.121.0 start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,postgres-meta,realtime
      - name: Save the Supabase images
        id: save-images
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | sort > "$RUNNER_TEMP/images-after"
          comm -13 "$RUNNER_TEMP/images-before" "$RUNNER_TEMP/images-after" | grep -v '<none>' > "$RUNNER_TEMP/images-new" || true
          cat "$RUNNER_TEMP/images-new"
          if [ -s "$RUNNER_TEMP/images-new" ]; then
            xargs docker save -o ~/supabase-images.tar < "$RUNNER_TEMP/images-new"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.save-images.outputs.saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/supabase-images.tar
          key: ${{ steps.supabase-images.outputs.cache-primary-key }}
      # The runner image ships Swift, for the app's Backend adapters.
      - run: swift --version
      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      # The pinned oasdiff scripts/api-compat.sh downloads into build/tools.
      - name: Cache oasdiff
        uses: actions/cache@v4
        with:
          path: build/tools
          key: oasdiff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/oasdiff-version') }}
      - run: scripts/verify.sh supabase api backend
        env:
          # What scripts/api-compat.sh compares openapi.json with: the PR's base, or main before
          # the push.
          API_COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # What new migrations must be numbered after (scripts/migration-order.sh): the base
          # branch's tip, not the merge base, so a PR can't slip in under one merged since it began.
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # The verify-wildcard API journeys, over HTTP against the built server.
      - run: scripts/api-journeys.sh
      # The image the deploy workflow ships builds, starts and reaches the database.
      - name: Start the server's image
        run: |
          docker build -t wildcard-api api
          eval "$(npx --yes supabase@2.121.0 status -o env)"
          docker run -d --name api --network host -e PORT=18080 -e DATABASE_URL="$DB_URL" \
            -e SUPABASE_URL="$API_URL" -e SUPABASE_SECRET_KEY="$SECRET_KEY" wildcard-api
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/health ||
            { docker logs api; exit 1; }

  # Builds the app, runs the UI tests on a simulator and uploads the screenshots they keep,
  # so reviewers and verifiers see every visible change without a Mac. The suite runs in three
  # parts on three Macs at once (scripts/ios-test.sh, SHARD), each building the app itself:
  # about 40 minutes instead of 1h30 one after another (2026-11-07). Reproducing one test
  # (only_testing) uses one Mac.
  ios:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.mac == 'true' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only_testing && '[1]' || '[1, 2, 3]') }}
    # One part is about 27 minutes of tests after a 12-minute build; the limit leaves room for a
    # cold build and the retries.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: xcodebuild -version
      # The app's Swift packages (sentry-cocoa's xcframeworks included), which the scripts clone into
      # build/spm. A new sentry-cocoa in the project still resolves; it is saved with the next key.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/spm
          key: spm-xcode-${{ hashFiles('ios/**/Package.swift', 'ios/**/Package.resolved') }}
          restore-keys: spm-xcode-
      - run: scripts/ios-test.sh
        env:
          PRINT_PREVIEWS: "1"
          ONLY_TESTING: ${{ inputs.only_testing }}
          SHARD: ${{ !inputs.only_testing && format('{0}/3', matrix.shard) || '' }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ github.event.pull_request.head.sha || github.sha }}-part${{ matrix.shard }}
          path: build/ios/screenshots
          if-no-files-found: error
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ github.event.pull_request.head.sha || github.sha }}-part${{ matrix.shard }}
          path: build/ios/Wildcard.xcresult

  # The parts' screenshots as one artifact, ios-screenshots-<sha>, the name verifiers look for.
  ios-screenshots:
    needs: ios
    if: always() && needs.ios.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          # Named after the commit the PR is at, not the merge commit GitHub tests.
          name: ios-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          pattern: ios-screenshots-${{ github.event.pull_request.head.sha || github.sha }}-part*
          delete-merged: true

  # Renders the character's clips on an iOS simulator through the player's own view and
  # uploads them, so reviewers see motion changes without a Mac.
  avatar-preview:
    needs: changes
    if: >-
      !inputs.only_testing && (
      !cancelled() && github.event_name == 'workflow_dispatch' && needs.changes.outputs.avatar == 'true')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: scripts/avatar-preview.sh
        env:
          PRINT_PREVIEWS: "1"
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named after the commit the PR is at, not the merge commit GitHub tests.
          name: avatar-previews-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/avatar/previews
          if-no-files-found: error
