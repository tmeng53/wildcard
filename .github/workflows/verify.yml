# Runs scripts/verify.sh for ready PRs and pushes to main (AGENTS.md, CI).
# GitHub-hosted runners are free while the repo is public. Never use a self-hosted
# runner here: on a public repo a fork's PR could run code on that machine.
# macOS runners have no Docker, so the database checks run in a Linux job.
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's newer push cancels its older run; each commit on main gets its own run.
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: swift --version
      - run: scripts/verify.sh swift web

  supabase:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Only the services the database tests use.
      - run: npx --yes supabase@2.121.0 start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,postgres-meta,realtime
      - run: scripts/verify.sh supabase
