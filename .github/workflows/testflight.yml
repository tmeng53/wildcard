# Builds the app, signs it and uploads it to TestFlight. It runs on every push to `main` that
# changes ios/ or this workflow, and by hand from `main` (Actions → testflight → Run workflow).
# TEMPORARY, until full launch: while the repo is public GitHub's Macs are free, and internal
# testers get every build. At launch (repo goes private, releases get gated) revisit this: switch
# back to manual runs, or to a schedule, so macOS minutes and tester notices stay under control.
# A burst of merges collapses into one build of the latest main: a newer push cancels the running
# and the pending upload. It shares the one free Mac with verify's scheduled `ios` job, but runs
# at most one at a time (about 6 minutes), so that job waits at most one build.
# Signing is automatic and Apple-managed: xcodebuild signs in to App Store Connect with an API key
# and Apple's cloud-managed distribution certificate signs the export, so no certificate or
# profile is kept anywhere. The key must have the Admin role: App Manager keys get "Cloud signing
# permission error". Its .p8 is the repository secret ASC_PRIVATE_KEY (the whole file, BEGIN and
# END lines included); its key id, the issuer and the team ids below are not secret.
# The build number is this workflow's run number and attempt (12.1, 13.1, 13.2…), which only grows,
# so every upload is new to App Store Connect; the version is MARKETING_VERSION in the project.
# https://developer.apple.com/documentation/xcode/distributing-your-app-for-beta-testing-and-releases
# https://developer.apple.com/documentation/appstoreconnectapi/creating-api-keys-for-app-store-connect-api
name: testflight

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: true

# None of these is secret.
env:
  ASC_KEY_ID: PLP7SKSLAZ
  ASC_ISSUER_ID: c1d7ff41-22e2-482b-95e2-fd4f71b5efb1
  TEAM_ID: WFY3YV6SPP

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Write the API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::Set the ASC_PRIVATE_KEY repository secret first."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Wildcard.xcodeproj \
            -scheme Wildcard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/testflight/Wildcard.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee build-archive.log
      # Crash reports in Sentry name our functions only with the build's debug symbols. Skipped
      # until the repository secret SENTRY_AUTH_TOKEN exists: a Sentry organization token, which
      # can upload files but read nothing, and names the organization itself.
      - name: Upload debug symbols to Sentry
        # Symbols are a help, never a reason to hold back a build.
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN: crash reports show our code as addresses."
            exit 0
          fi
          npx --yes @sentry/cli@3.8.0 debug-files upload --project wildcard-ios \
            build/testflight/Wildcard.xcarchive/dSYMs
      - name: Export and upload
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/testflight/Wildcard.xcarchive \
            -exportOptionsPlist ios/Config/ExportOptions.plist \
            -exportPath build/testflight/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build-export.log
          version="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' build/testflight/Wildcard.xcarchive/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' build/testflight/Wildcard.xcarchive/Info.plist)"
          echo "Uploaded Wildcard $version ($build). App Store Connect processes it before it shows in TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs-${{ github.run_number }}.${{ github.run_attempt }}
          path: build-*.log
          if-no-files-found: ignore
