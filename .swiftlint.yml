# Style is swift-format's job (.swift-format); SwiftLint adds the rules it doesn't cover.
included:
  - ios
excluded:
  - ios/**/.build
  - ios/Packages/Contracts/Sources/APIContract/Generated  # scripts/swift-openapi.sh writes these
  - ios/Packages/Backend/Sources/Backend/Generated
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unowned_variable_capture
disabled_rules:
  - trailing_comma       # swift-format owns commas
  - opening_brace        # swift-format owns braces
  - line_length          # swift-format owns line length
identifier_name:
  excluded: [id, s, m, l, xs, xl, xxs, xxl, y, z]  # y, z: Hinnant's date algorithms
type_name:
  excluded: [ID]
large_tuple:
  warning: 3  # (year, month, day)
force_try: error
force_unwrapping: error

# AGENTS.md rules a regex can catch (first drafted for issue #6).
custom_rules:
  unchecked_sendable_without_reason:
    name: "@unchecked Sendable needs a reason"
    message: "AGENTS.md: say why it is safe in a comment on the same line."
    regex: '@unchecked\s+Sendable(?![^\n]*//)'
    severity: error
  domain_imports_ui_or_backend:
    name: "Domain imports UI or Backend"
    message: "AGENTS.md: Domain targets never import SwiftUI, UIKit, Backend or APIContract."
    included: '.*/Sources/[^/]*Domain/.*\.swift'
    regex: '^\s*(@testable\s+)?import\s+(SwiftUI|UIKit|Backend|APIContract)\b'
    severity: error
  olympic_terms:
    name: "Olympic terms"
    message: "AGENTS.md: never use 奥运, the rings or \"Olympic\" in code-visible copy or names."
    regex: '(奥运|[Oo]lympic)'
    severity: error
  shared_package_names:
    name: "Topic-less module name"
    message: "AGENTS.md: name shared code after its topic, never Utils, Shared, Common or Helpers."
    regex: '^\s*import\s+(Utils|Shared|Common|Helpers)\b'
    severity: error
  # Screens take their look from DesignSystem by name (AGENTS.md, Architecture). A view of its
  # own is fine in a screen; a raw color, radius, font, spacing or haptic is not.
  raw_color:
    name: "Raw color"
    message: "AGENTS.md: take colors from ColorRole, never Palette, a system color or RGB numbers."
    excluded: '.*/(Packages/DesignSystem|Packages/Avatar|Tests)/.*'
    regex: '(\bPalette\.|\bColor\.(red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|primary|secondary)\b|\.(foregroundStyle|foregroundColor|fill|stroke|tint|background)\(\s*\.(red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|primary|secondary|tertiary)\b|\bColor\((red|white|hue|uiColor):|\.sRGB\b)'
    severity: error
  # Brand screens wear the brand's colour whatever scene the squad picked (AGENTS.md, Brand vs
  # scene in ios/Packages/DesignSystem/README.md). Add a screen's files here when it turns brand.
  scene_role_on_brand_screen:
    name: "Scene colour on a brand screen"
    message: "Brand screens use bgBrand/fgOnBrand, neutrals and .accentTone(.brand), never the scene's roles."
    included: '.*/(Packages/Me/Sources/.*|Packages/CheckIn/Sources/CheckInUI/(ComposeView|DisclaimerComposer|PhotoStep|SportPicker)\.swift|Packages/DesignSystem/Sources/DesignSystemUI/TabBar\.swift)$'
    regex: '\.(bgAccent|bgAccentSubtle|fgOnAccent|fgAccent|bgScene|fgOnScene|ring|bgKind|bgKindOnScene|fgKind)\b'
    severity: error
  raw_corner_radius:
    name: "Raw corner radius"
    message: "AGENTS.md: take radii from Radius (pick, card, thumbnail, capsule), never a number."
    regex: 'cornerRadius:\s*-?[0-9]'
    severity: error
  raw_spacing:
    name: "Raw spacing"
    message: "AGENTS.md: take spacing from Space, never a number (0 is fine)."
    excluded: '.*/(Packages/DesignSystem|Packages/Avatar|Tests)/.*'
    regex: '(spacing:\s*-?[1-9]|\.padding\((\.[A-Za-z]+,\s*|\[[^\]]*\],\s*)?-?[1-9]|\bEdgeInsets\()'
    severity: error
  raw_text_style:
    name: "Raw text style"
    message: "AGENTS.md: set text with .typeStyle(TypeRamp...), never a system text style (an SF Symbol may take .system(size:))."
    excluded: '.*/(Packages/DesignSystem|Tests)/.*'
    regex: '\.font\(\.(largeTitle|title|title2|title3|headline|subheadline|body|callout|footnote|caption|caption2)\b'
    severity: error
  raw_haptic:
    name: "Raw haptic"
    message: "AGENTS.md: play haptics with .haptic(Haptic...), never sensoryFeedback or a feedback generator."
    excluded: '.*/(Packages/DesignSystem|Tests)/.*'
    regex: '(\.sensoryFeedback\(|FeedbackGenerator\b)'
    severity: error
